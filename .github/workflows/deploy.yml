# Deploys to the VPS after CI passes on main (Decisions 12 and 69): builds the images, copies them over SSH,
# and runs scripts/server/deploy.sh there.
#
# To enable it: create the protected "production" environment, add the secrets VPS_HOST, VPS_SSH_KEY and
# VPS_KNOWN_HOSTS, and set the repository variable DEPLOY_ENABLED=true. Until then the job is skipped.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Build production images
        run: |
          docker build -f docker/Dockerfile.prod --target migrator -t explorehills-migrator:${{ github.sha }} .
          docker build -f docker/Dockerfile.prod --target runner -t explorehills-app:${{ github.sha }} .
          docker build -f docker/Dockerfile.prod --target worker -t explorehills-worker:${{ github.sha }} .

      # Secrets stay on the server (Decision 69). The images travel over SSH, so no registry is needed.
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy the images and server files
        env:
          VPS: deploy@${{ secrets.VPS_HOST }}
          TAG: ${{ github.sha }}
        run: |
          docker save "explorehills-migrator:$TAG" "explorehills-app:$TAG" "explorehills-worker:$TAG" |
            gzip | ssh -i ~/.ssh/id_deploy "$VPS" 'gunzip | docker load'
          scp -i ~/.ssh/id_deploy docker/docker-compose.server.yml docker/Caddyfile "$VPS:/opt/explorehills/"
          scp -i ~/.ssh/id_deploy scripts/server/*.sh scripts/ops/*.sh "$VPS:/opt/explorehills/scripts/"

      # A failed migration or health check stops here, with the previous version still serving.
      - name: Deploy
        env:
          VPS: deploy@${{ secrets.VPS_HOST }}
          TAG: ${{ github.sha }}
        run: ssh -i ~/.ssh/id_deploy "$VPS" "cd /opt/explorehills && scripts/deploy.sh $TAG"
